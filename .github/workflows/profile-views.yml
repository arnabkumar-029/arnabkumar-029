name: Profile Views Counter

on:
  workflow_dispatch:

  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  update-counter:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate Profile Views
        run: |
          python scripts/profile_views.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile_views.json profile-views.svg

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update profile views"
            git push
          fi
